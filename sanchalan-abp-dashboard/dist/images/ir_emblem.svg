<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer red circle background -->
  <circle cx="100" cy="100" r="96" fill="#D32F2F" stroke="#B71C1C" stroke-width="4"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2,2"/>
  
  <!-- Outer text ring border -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="100" cy="100" r="54" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Circular text path for INDIAN RAILWAYS & भारतीय रेल -->
  <defs>
    <path id="textPathTop" d="M 30,100 A 70,70 0 1,1 170,100" />
    <path id="textPathBottom" d="M 170,100 A 70,70 0 0,1 30,100" />
  </defs>
  
  <!-- Curved text -->
  <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'IBM Plex Sans', sans-serif" font-weight="700" font-size="14.5" letter-spacing="1">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">INDIAN RAILWAYS</textPath>
  </text>
  <text fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-weight="700" font-size="15" letter-spacing="1">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">भारतीय रेल</textPath>
  </text>
  
  <!-- Decorative stars in ring -->
  <circle cx="28" cy="100" r="3" fill="#FFFFFF"/>
  <circle cx="172" cy="100" r="3" fill="#FFFFFF"/>
  <polygon points="100,24 102,28 107,28 103,31 105,35 100,32 95,35 97,31 93,28 98,28" fill="#FFFFFF"/>

  <!-- Inner central train & track emblem -->
  <g transform="translate(100, 106) scale(0.65)">
    <!-- Horizontal track lines -->
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-50" y1="-10" x2="50" y2="-10" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-50" y1="10" x2="50" y2="10" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-50" y1="20" x2="50" y2="20" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-50" y1="30" x2="50" y2="30" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Train Locomotive front silhouette -->
    <!-- Boiler / Body circle -->
    <circle cx="0" cy="0" r="34" fill="#D32F2F" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Headlight -->
    <circle cx="0" cy="-22" r="7" fill="#FFFFFF" stroke="#D32F2F" stroke-width="2"/>
    <circle cx="0" cy="-22" r="3" fill="#FFD54F"/>

    <!-- Cab Window -->
    <rect x="-16" y="-12" width="32" height="14" rx="2" fill="#FFFFFF"/>
    <rect x="-13" y="-10" width="11" height="10" rx="1" fill="#D32F2F"/>
    <rect x="2" y="-10" width="11" height="10" rx="1" fill="#D32F2F"/>

    <!-- Cowcatcher / Buffer plate -->
    <polygon points="-28,14 28,14 22,28 -22,28" fill="#FFFFFF"/>
    <circle cx="-16" cy="21" r="3.5" fill="#D32F2F"/>
    <circle cx="16" cy="21" r="3.5" fill="#D32F2F"/>
    <line x1="-28" y1="14" x2="28" y2="14" stroke="#D32F2F" stroke-width="2"/>

    <!-- Side Pistons/Arms -->
    <path d="M -34,0 L -46,-20 M 34,0 L 46,-20" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
